p{margin:0}
.muted{color:var(--muted)}

.sync{font-size:12.5px}

@media (max-width:860px){

#printDoc .pg{page-break-before:always}

class LocalStore{constructor(id){this.id=id;this.key='np-plan-'+id;this.cbs=[];this.live=false;
  this.bc=('BroadcastChannel' in window)?new BroadcastChannel('np-'+id):null;if(this.bc)this.bc.onmessage=()=>this.emit()}
  async exists(){return !!ls.get(this.key)}
  async create(plan){ls.set(this.key,plan)}
  subscribe(cb){this.cbs.push(cb);setTimeout(()=>this.emit(),0)}
  emit(){const d=ls.get(this.key);this.cbs.forEach(cb=>cb(d))}
  async update(paths){const d=ls.get(this.key)||blankPlan();for(const p in paths)setPath(d,p,paths[p]);d.updatedAt=Date.now();ls.set(this.key,d);if(this.bc)this.bc.postMessage(1)}}
class FireStore{constructor(id){this.id=id;this.cbs=[];this.live=true}
  ref(){return fb.db.collection('plans').doc(this.id)}
  async exists(){const s=await this.ref().get();return s.exists}
  async create(plan){plan.updatedAt=Date.now();await this.ref().set(plan)}
  subscribe(cb,err){this.unsub=this.ref().onSnapshot(s=>cb(s.exists?s.data():null),e=>err&&err(e))}
  async update(paths){const u={};for(const p in paths)u[p]=paths[p]===DEL?firebase.firestore.FieldValue.delete():paths[p];u.updatedAt=Date.now();await this.ref().update(u)}}

  $('#imNo').addEventListener('click',()=>{imported=null;$('#imConfirm').hidden=true});
  $('#imYes').addEventListener('click',async()=>{if(!imported)return;const keys=['meta','fields','rows','owners','zopa'];const u={};keys.forEach(k=>u[k]=imported[k]||(k==='rows'?{concess:{},gaps:{},cont:{}}:{}));
    await writeNow(u);$('#imConfirm').hidden=true;imported=null;renderApp();toast('Backup loaded')});
  setInterval(()=>{if(!document.hidden)presence(true)},120000);setInterval(()=>renderPresence(),15000);}
function fileBase(){return (S.meta.title||'negotiation-plan').replace(/[^\w\-]+/g,'-').replace(/-+/g,'-').slice(0,60)}
function download(name,data,type){const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function copyText(el){const t=el.value!==undefined?el.value:el.textContent;const fb=()=>{if(el.select){el.select()}toast('Selected. Press Ctrl+C or ⌘C to copy')};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),fb)}catch(e){fb()}}
function shareLink(){if(!store.live){toast('Live sync is off in this copy. Use Export & share → Download backup to pass the plan on.');$('#s-export').scrollIntoView();return}
  const url=location.href.split('#')[0]+'#plan='+store.id;
  try{navigator.clipboard.writeText(url).then(()=>toast('Team link copied. Anyone with it can edit.'),()=>toast('Copy this link: '+url))}catch(e){toast('Copy this link: '+url)}}

/* ---------- presence ---------- */
let lastBeat=0;
function presence(beat){if(!ME)return;const now=Date.now();if(beat&&now-lastBeat<110000)return;lastBeat=now;
  if(!store.live){return renderPresence()}
  store.update({['presence.'+CID]:{n:ME,s:lastSec||'overview',t:now}}).catch(()=>{})}
function renderPresence(){const now=Date.now();const pr=Object.entries(S.presence||{}).filter(([id,p])=>id!==CID&&p&&now-p.t<300000);
  const on=$('#online');if(on){on.hidden=!store.live;on.textContent=pr.length?'Also here: '+pr.map(p=>p[1].n).join(', '):'Only you right now'}
  document.querySelectorAll('[data-editing]').forEach(el=>{const sec=el.dataset.editing;el.innerHTML=pr.filter(p=>p[1].s===sec).map(p=>`<span>${esc(p[1].n)} here</span>`).join('')})}
function askName(force){if(ME&&!force){presence(true);return}const ms=members();
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="nmT"><h3 id="nmT">Who are you?</h3><p class="muted">Your name shows teammates which section you are working on.</p>
   ${ms.length?`<div class="members">${ms.map(x=>`<button class="mchip" type="button" data-pick="${esc(x.name)}" style="border:0;cursor:pointer;padding:6px 12px">${esc(x.name)}</button>`).join('')}</div>`:''}
   <input type="text" id="nmIn" placeholder="Your name" aria-label="Your name" value="${esc(ME)}"><div class="row"><button class="btn primary" type="button" id="nmOk">Continue</button></div></div>`;
  document.body.appendChild(m);const ok=()=>{const v=$('#nmIn').value.trim();if(!v){$('#nmIn').focus();return}ME=v;ls.set('np-name',v);m.remove();$('#meBtn').textContent='You: '+ME;
    if(!members().some(x=>x.name.toLowerCase()===v.toLowerCase()))writeNow({['meta.members.'+rid(8)]:{name:v,o:Date.now()}}).then(syncDom);presence()};
  m.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{$('#nmIn').value=b.dataset.pick;ok()}));
  $('#nmOk').addEventListener('click',ok);$('#nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')ok()});setTimeout(()=>$('#nmIn').focus(),30)}

/* ---------- sync DOM from state ---------- */
function syncDom(initial){if(!S||!$('#app')||$('#app').hidden)return;const act=document.activeElement;
  // rows: rebuild a table only when its rows changed
  for(const sec in ROWDEFS){const tb=document.querySelector(`[data-rows="${sec}"]`);if(!tb)continue;const ids=Object.keys(S.rows[sec]||{}).sort().join(',');
    if(tb.dataset.ids!==ids){const fp=act&&tb.contains(act)?act.dataset.path:null;const sel=fp&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null;
      tb.innerHTML=rowsHTML(sec);tb.dataset.ids=ids;if(fp){const n=tb.querySelector(`[data-path="${fp}"]`);if(n){setVal(n);n.focus();if(sel&&n.setSelectionRange)try{n.setSelectionRange(...sel)}catch(e){}}}}}
  // owner selects need fresh member options
  const mkey=members().map(m=>m.id+m.name).join('|');
  document.querySelectorAll('[data-owner]').forEach(sel=>{if(sel.dataset.mkey!==mkey&&sel!==act){sel.innerHTML=`<option value="">Unassigned</option>${members().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}`;sel.dataset.mkey=mkey}});
  document.querySelectorAll('#app [data-path]').forEach(el=>{if(el===act&&!initial)return;if(Object.prototype.hasOwnProperty.call(pending,el.dataset.path)&&!initial)return;setVal(el)});
  refreshDerived()}
function setVal(el){let v=getPath(S,el.dataset.path);if(v==null)v='';v=String(v);if(el.value!==v)el.value=v;grow(el)}
function grow(el){if(el.tagName!=='TEXTAREA'||!el.dataset.path)return;el.style.height='auto';if(el.scrollHeight)el.style.height=(el.scrollHeight+2)+'px'}
function refreshDerived(){if(!S||!$('#docTitle'))return;
  $('#docTitle').textContent=S.meta.title||'Negotiation plan';$('#meBtn').textContent=ME?'You: '+ME:'Set your name';
  // tags
  MAP_ROWS.forEach(([k])=>['self','other'].forEach(side=>{const key=side+'_'+k;const f=S.fields[key]||{};const cell=document.querySelector(`[data-cell="${key}"]`);if(!cell)return;
    cell.classList.remove('t-S','t-I','t-U');if(f.tag)cell.classList.add('t-'+f.tag);cell.querySelectorAll('[data-inferred]').forEach(x=>x.hidden=f.tag!=='I')}));
  // members
  const mbox=$('#members');if(mbox){const ms=members();const key=ms.map(m=>m.id+m.name).join('|');if(mbox.dataset.k!==key){mbox.dataset.k=key;
    mbox.innerHTML=ms.map(m=>`<span class="mchip">${esc(m.name)}<button type="button" data-rmm="${m.id}" aria-label="Remove ${esc(m.name)}">×</button></span>`).join('')||'<span class="hint">No team members yet.</span>'}}
  // completeness
  const comp=completeness();let filled=0,total=0;SECTIONS.forEach(([id])=>{const c=comp[id];const st=document.querySelector(`[data-st="${id}"]`);if(!c||!st)return;filled+=c.f;total+=c.t;
    st.className='st'+(c.f>=c.t?' done':c.f>0?' part':'');st.title=`${c.f} of ${c.t} filled`});
  SECTIONS.forEach(([id])=>{const o=document.querySelector(`[data-ow="${id}"]`);if(o)o.textContent=initials(mName(S.owners[id]))});
  const unk=MAP_ROWS.flatMap(([k,l])=>['self','other'].map(side=>({k:side+'_'+k,l,side,f:S.fields[side+'_'+k]||{}}))).filter(x=>x.f.tag==='U');
  const inf=MAP_ROWS.flatMap(([k])=>['self','other'].map(s=>S.fields[s+'_'+k]||{})).filter(f=>f.tag==='I');
  const noBasis=inf.filter(f=>!(f.basis||'').trim()||!f.conf).length;
  const unowned=SECTIONS.filter(([id])=>!['spar','export'].includes(id)&&!S.owners[id]).length;
  $('#stats').innerHTML=`<div class="stat"><span class="muted">Completed</span><b>${total?Math.round(filled/total*100):0}%</b></div>
   <div class="stat"><span class="muted">Unknowns (U)</span><b>${unk.length}</b></div><div class="stat"><span class="muted">Gap register rows</span><b>${Object.keys(S.rows.gaps||{}).length}</b></div>
   <div class="stat"><span class="muted">Inferences missing basis</span><b>${noBasis}</b></div><div class="stat"><span class="muted">Sections without owner</span><b>${unowned}</b></div>`;
  $('#meterFill').style.width=(total?filled/total*100:0)+'%';
  $('#unknowns').innerHTML=unk.length?unk.map(u=>`<div class="unk-item"><span><b>${u.side==='self'?'Self':'Other'} · ${esc(u.l)}</b>${u.f.text?': '+esc(u.f.text):''}</span>${u.f.g&&S.rows.gaps[u.f.g]?'<span class="badge ok">In gap register</span>':`<button class="btn small" type="button" data-unk="${u.k}">Add to gap register</button>`}</div>`).join(''):'<span class="hint">No entries are tagged U. Tag anything you do not know yet as Unknown.</span>';
  drawZopa();sparFill();renderPresence()}
function completeness(){const F=k=>!!((S.fields[k]||{}).text||'').trim();const out={};
  out.overview={f:['title','name','role','negotiation','date','preparedBy'].filter(k=>(S.meta[k]||'').trim()).length+(members().length?1:0),t:7};
  const keys=MAP_ROWS.flatMap(([k])=>['self_'+k,'other_'+k]);out.map={f:keys.filter(F).length,t:keys.length};
  const z=S.zopa;out.zopa={f:[z.myRes,z.theirRes].filter(Number.isFinite).length+['zopa_mine_basis','zopa_theirs_basis','zopa_est'].filter(F).length,t:5};
  for(const sec in ROWDEFS){const first=ROWDEFS[sec].cols[0][0];const n=Object.values(S.rows[sec]||{}).filter(r=>(r[first]||'').trim()).length;out[sec]={f:Math.min(n,sec==='gaps'?1:2),t:sec==='gaps'?1:2}}
  for(const sec in TEXTS){const ks=TEXTS[sec].map(x=>x[0]);out[sec]={f:ks.filter(F).length,t:ks.length}}
  return out}

/* ---------- ZOPA ---------- */
function zopaCalc(){const z=S.zopa;const mr=z.myRes,tr=z.theirRes;if(!Number.isFinite(mr)||!Number.isFinite(tr))return{ok:false,msg:'Enter both reservation prices first.'};
  const seller=z.side!=='buyer';const lo=seller?mr:tr,hi=seller?tr:mr;return{ok:true,seller,has:hi>=lo,lo,hi,gap:lo-hi,width:hi-lo}}
function drawZopa(){const box=$('#zchart');if(!box)return;const z=S.zopa;const vals=[z.myRes,z.myTarget,z.theirRes,z.theirOpen].filter(Number.isFinite);
  if(vals.length<2){box.innerHTML='<p class="hint" style="padding:12px">Enter at least the two reservation prices to draw the zone.</p>';$('#zsum').innerHTML='';return}
  const cs=getComputedStyle(document.documentElement);const C=n=>cs.getPropertyValue(n).trim();
  let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn||Math.abs(mx)||1)*0.12;mn-=pad;mx+=pad;const W=900,L=150,X=v=>L+(v-mn)/(mx-mn)*(W-L-40);
  const r=zopaCalc();const seller=z.side!=='buyer';
  const bar=(a,b,y,col,label)=>`<text x="${L-14}" y="${y+12}" text-anchor="end" font-size="15" font-weight="700" fill="${col}">${label}</text>`+(Number.isFinite(a)&&Number.isFinite(b)?`<rect x="${Math.min(X(a),X(b))}" y="${y}" width="${Math.max(3,Math.abs(X(b)-X(a)))}" height="16" rx="8" fill="${col}" opacity=".85"/>`:'');
  const mark=(v,y,col,label)=>Number.isFinite(v)?`<line x1="${X(v)}" x2="${X(v)}" y1="${y-6}" y2="${y+22}" stroke="${col}" stroke-width="3"/><text x="${X(v)}" y="${y+40}" font-size="13.5" text-anchor="middle" fill="${C('--ink')}">${esc(label)} ${fmtN(v)}</text>`:'';
  let zone='';if(r.ok){if(r.has)zone=`<rect x="${X(r.lo)}" y="36" width="${Math.max(2,X(r.hi)-X(r.lo))}" height="170" fill="${C('--ok')}" opacity=".16"/><text x="${(X(r.lo)+X(r.hi))/2}" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="${C('--ok')}">ZOPA</text>`;
    else zone=`<rect x="${X(r.hi)}" y="36" width="${Math.max(2,X(r.lo)-X(r.hi))}" height="170" fill="${C('--warn')}" opacity=".14"/><text x="${(X(r.lo)+X(r.hi))/2}" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="${C('--warn')}">No overlap</text>`}
  // ticks
  const step=niceStep((mx-mn)/6);let ticks='';for(let t=Math.ceil(mn/step)*step;t<=mx;t+=step)ticks+=`<line x1="${X(t)}" x2="${X(t)}" y1="206" y2="212" stroke="${C('--muted')}"/><text x="${X(t)}" y="230" font-size="13" text-anchor="middle" fill="${C('--muted')}">${fmtN(+t.toFixed(6))}</text>`;
  const ourRange=seller?[z.myRes,z.myTarget]:[z.myTarget,z.myRes];const theirRange=seller?[z.theirOpen,z.theirRes]:[z.theirRes,z.theirOpen];
  box.innerHTML=`<svg viewBox="0 0 ${W} 242" xmlns="http://www.w3.org/2000/svg">${zone}
   <line x1="${L-10}" x2="${W-30}" y1="206" y2="206" stroke="${C('--muted')}"/>${ticks}
   ${bar(ourRange[0],ourRange[1],62,C('--self'),'Us')}${mark(z.myRes,62,C('--self'),'our walk-away')}
   ${bar(theirRange[0],theirRange[1],140,C('--other'),'Them (est.)')}${mark(z.theirRes,140,C('--other'),'their walk-away')}
   <text x="${L-14}" y="230" text-anchor="end" font-size="13" fill="${C('--muted')}">${esc(z.unit||'')}</text></svg>`;
  const u=esc(z.unit||'');let s='';
  if(r.ok){s=r.has?`<div class="callout ok"><b>ZOPA: ${fmtN(r.lo)} – ${fmtN(r.hi)} ${u}</b>. Width ${fmtN(r.width)}.${Number.isFinite(z.myTarget)?(seller?(z.myTarget>r.hi?' Your target is above their estimated limit: expect to concede toward the zone.':''):(z.myTarget<r.lo?' Your target is below their estimated limit: expect to concede toward the zone.':'')):''} Their reservation is an estimate, so close the related intelligence gaps first.</div>`
    :`<div class="callout warn"><b>No ZOPA on current estimates</b>: a gap of ${fmtN(r.gap)} ${u}. Re-check their reservation, add value through other terms, or rely on your BATNA.</div>`}
  $('#zsum').innerHTML=s}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}

/* ---------- sparring prompts ---------- */
function sparFill(){const out=$('#spText');if(!out||!S)return;const kind=$('#sp-kind').value,lvl=$('#sp-level').value;
  const F=k=>((S.fields[k]||{}).text||'').trim();const z=S.zopa;const u=z.unit||'';
  const other=MAP_ROWS.map(([k,l])=>{const f=S.fields['other_'+k]||{};return f.text?`- ${l}: ${f.text}${f.tag?` [${TAGS[f.tag]}${f.tag==='I'&&f.conf?', confidence '+f.conf:''}]`:''}`:''}).filter(Boolean).join('\n');
  const self=MAP_ROWS.map(([k,l])=>{const f=S.fields['self_'+k]||{};return f.text?`- ${l}: ${f.text}`:''}).filter(Boolean).join('\n');
  const conc=Object.values(S.rows.concess||{}).sort((a,b)=>(a.o||0)-(b.o||0)).filter(r=>r.item).map(r=>`- ${r.item} (costs us: ${r.cost||'?'}; we want: ${r.expect||'?'})`).join('\n');
  const tone={firm:'Be firm but fair. Concede when given good reasons.',tough:'Be tough. Push hard on price and terms, test every claim, and concede only for something in return.',brutal:'Be very tough. Use pressure tactics such as deadlines, competitor offers and silence. Concede rarely.'}[lvl];
  let t='';
  if(kind==='spar')t=`You are role-playing the other party in a negotiation so that our team can rehearse.

NEGOTIATION: ${S.meta.negotiation||'(not specified)'}
YOU PLAY: the other side${S.fields.proc_theirs&&F('proc_theirs')?' ('+F('proc_theirs')+')':''}.

What we believe about your side (some of it may be wrong; stay realistic):
${other||'- (nothing entered yet)'}
${Number.isFinite(z.theirRes)?`Your private walk-away point is around ${fmtN(z.theirRes)} ${u}. Never reveal it.`:''}${Number.isFinite(z.theirOpen)?` Open at about ${fmtN(z.theirOpen)} ${u}.`:''}

RULES
- Stay in character. ${tone}
- Raise at least one objection we have not prepared for.
- Ask probing questions about our weaknesses, but only use what a real counterpart could plausibly know.
- Keep each reply under 120 words. Wait for our answer before continuing.
- If we say "PAUSE", step out of character and score our last move from 1 to 10, with one specific improvement.
- When we say "END", give a short debrief: where we conceded too fast, what we left on the table, and whether the deal beats our BATNA.

Start by greeting us and stating your opening position.`;
  if(kind==='debrief')t=`Act as a negotiation coach. Below is our plan and, after it, the transcript of a rehearsal. Assess the rehearsal against the plan.

OUR PLAN
${self||'- (not entered)'}
Our reservation: ${fmtN(z.myRes)} ${u} · our target: ${fmtN(z.myTarget)} ${u}
Planned concessions:
${conc||'- (none listed)'}
Walk-away triggers: ${F('walk')||'(none listed)'}
Opening move: ${F('open_anchor')||'(none)'}. ${F('open_just')}

Please answer:
1. Did we keep to our reservation price and concession sequence? Quote the moment we deviated.
2. Which of their claims did we accept without testing?
3. Three specific lines we should say differently next time.
4. One intelligence gap we should close before the real meeting.

TRANSCRIPT
[paste the rehearsal here]`;
  if(kind==='red')t=`Act as a sceptical negotiation expert and red-team our plan. Do not praise it.

NEGOTIATION: ${S.meta.negotiation||'(not specified)'}
OUR SIDE
${self||'- (not entered)'}
THEIR SIDE (our assumptions; tags show Stated / Inferred / Unknown)
${other||'- (not entered)'}
ZOPA estimate: ${F('zopa_est')||'(not entered)'}
Opening move: ${F('open_anchor')||'(none)'}. Not to reveal: ${F('open_hide')||'(nothing listed)'}

Please return:
1. The three weakest assumptions in this plan, ranked, and why each could be wrong.
2. The most likely move from them that we have not prepared a contingency for.
3. Whether our BATNA is truly better than a bad deal, and what would change that.
4. One frugal way to test our riskiest assumption before the meeting.`;
  out.value=t}

/* ---------- export document ---------- */
function buildDoc(full){const F=k=>esc(((S.fields[k]||{}).text||'')).replace(/\n/g,'<br>');const z=S.zopa,u=esc(z.unit||'');
  const tagTxt=f=>f.tag?` <i>[${f.tag}${f.tag==='I'?(f.conf?' · '+f.conf:'')+(f.basis?' · '+esc(f.basis):''):''}]</i>`:'';
  const rowsT=(sec)=>{const d=ROWDEFS[sec];const rs=Object.values(S.rows[sec]||{}).sort((a,b)=>(a.o||0)-(b.o||0));return `<table><tr>${d.cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rs.map(r=>`<tr>${d.cols.map(c=>`<td>${esc(r[c[0]]||'').replace(/\n/g,'<br>')}</td>`).join('')}</tr>`).join('')||`<tr>${d.cols.map(()=>'<td>&nbsp;</td>').join('')}</tr>`}</table>`};
  const own=sec=>S.owners[sec]?` <span style="font-weight:400;font-size:9pt">(owner: ${esc(mName(S.owners[sec]))})</span>`:'';
  const body=`<h1>Negotiation Planning Document</h1>
  <table><tr><th>Name</th><td>${esc(S.meta.name)}</td><th>Role</th><td>${esc(S.meta.role)}</td></tr><tr><th>Negotiation</th><td colspan="3">${esc(S.meta.negotiation)}</td></tr>
  <tr><th>Date</th><td>${esc(S.meta.date)}</td><th>Prepared by</th><td>${esc(S.meta.preparedBy)}</td></tr><tr><th>Team</th><td colspan="3">${members().map(m=>esc(m.name)).join(', ')}</td></tr></table>
  <h2>Self vs other${own('map')}</h2><table><tr><th></th><th>SELF</th><th>OTHER</th></tr>${MAP_ROWS.map(([k,l,s])=>`<tr><th>${l}${s?`<br><span style="font-weight:400;font-size:9pt">(${s})</span>`:''}</th><td>${F('self_'+k)}${tagTxt(S.fields['self_'+k]||{})}</td><td>${F('other_'+k)}${tagTxt(S.fields['other_'+k]||{})}</td></tr>`).join('')}</table>
  <p style="font-size:9pt">Tags: [S] stated · [I] inferred (basis and confidence H/M/L) · [U] unknown, carried to the intelligence gap register.</p>
  <h2 class="pg">1. Zone of possible agreement${own('zopa')}</h2><table><tr><th></th><th>Value</th><th>Confidence / basis</th></tr>
   <tr><th>My reservation price</th><td>${Number.isFinite(z.myRes)?fmtN(z.myRes)+' '+u:''}</td><td>${F('zopa_mine_basis')}</td></tr>
   <tr><th>Their reservation price (est.)</th><td>${Number.isFinite(z.theirRes)?fmtN(z.theirRes)+' '+u:''}</td><td>${F('zopa_theirs_basis')}</td></tr>
   <tr><th>Estimated ZOPA</th><td colspan="2">${F('zopa_est')}</td></tr><tr><th>If no ZOPA: implication</th><td colspan="2">${F('zopa_none')}</td></tr></table>
  <h2>2. Concession plan${own('concess')}</h2>${rowsT('concess')}
  <h2>3. Process design${own('process')}</h2><table>${[['Attendees (mine / theirs)',F('proc_mine')+(F('proc_theirs')?' / '+F('proc_theirs'):'')],['Channel and venue',F('proc_channel')],['Agenda and sequence of topics',F('proc_agenda')],['Rounds expected / timetable',F('proc_rounds')]].map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table>
  <h2>4. Walk-away triggers${own('walk')}</h2><table><tr><td>${F('walk')||'&nbsp;'}</td></tr></table>
  <h2 class="pg">5. Relationship after the deal${own('rel')}</h2><table><tr><td>${F('rel')||'&nbsp;'}</td></tr></table>
  <h2>6. Intelligence gap register${own('gaps')}</h2>${rowsT('gaps')}
  <h2>7. Opening move${own('opening')}</h2><table>${TEXTS.opening.map(([k,l])=>`<tr><th>${l}</th><td>${F(k)}</td></tr>`).join('')}</table>
  <h2>8. Contingencies${own('cont')}</h2>${rowsT('cont')}
  <h2 class="pg">9. Other information${own('other')}</h2><table><tr><td>${F('other')||'&nbsp;'}</td></tr></table>`;
  if(!full)return body;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(S.meta.title)}</title>
  <style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{font-size:18pt}h2{font-size:13pt;margin-top:14pt}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4pt 6pt;vertical-align:top;text-align:left}th{background:#EEEEEE}.pg{page-break-before:always}</style></head><body>${body}</body></html>`}

/* ---------- boot ---------- */
route();
</script>
</body>
</html>
